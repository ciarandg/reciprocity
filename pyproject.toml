[project]
name = "reciprocity"
version = "0.1.0"
description = "A CLI and daemon for converting recipe scans to Markdown"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ollama>=0.6.1",
    "pdf2image>=1.17.0",
    "pytesseract>=0.3.13",
    "typer>=0.23.1",
    "watchfiles>=1.1.1",
]

[project.scripts]
reciprocity = "reciprocity:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reciprocity"]

[tool.hatch.build.targets.wheel.package-data]
"reciprocity" = ["data/*.txt"]
